# Keep Gradle memory conservative for 8GB machines to avoid daemon crash.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true

# Workaround for Windows projects on a different drive than Pub cache (C: vs E:)
# which can break Kotlin incremental caches with "different roots".
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Ensure Gradle uses JDK 17 instead of legacy Java 8 runtime.
org.gradle.java.home=C:/Program Files/Java/jdk-17
